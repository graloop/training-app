services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trainer}
    volumes:
      - trainer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trainer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-trainer}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trainer}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FERNET_KEY: ${FERNET_KEY:?set FERNET_KEY in .env}
      # The hosted app's first admin login. Fill both in before deploying
      # (Portainer: the stack's "Environment variables" section). The password
      # is only used to create the account; change it in the app afterwards.
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME to the admin username you want}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD to the admin password you want}
      # SEED_TEST_ACCOUNTS is deliberately not passed: the generic admin/user
      # test logins only exist under `npm start`.
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      GARMIN_SYNC_LOOKBACK_DAYS: ${GARMIN_SYNC_LOOKBACK_DAYS:-30}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
    ports:
      - "8010:8000"

volumes:
  trainer_pgdata:
